# Advanced Speech to Text: v0.1.0
# Generated by scripts/generate_compose.py on release. Do not edit by hand:
# change deploy/compose.template.yml instead.
#
# Usage:
#   cp .env.example .env    # then set POSTGRES_PASSWORD and ADMIN_PASSWORD
#   docker compose up -d
name: advanced-speech-to-text

x-common-env: &common-env
  POSTGRES_HOST: db
  POSTGRES_USER: ${POSTGRES_USER:-stt}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:-stt}
  TZ: ${TZ:-UTC}
  # Default model for new uploads, and the models users may choose from.
  WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
  WHISPER_MODELS: ${WHISPER_MODELS:-small.en,medium.en,large-v3-turbo,large-v3}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-stt}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: ghcr.io/ashleycollinge1/advanced-speech-to-text:0.1.0@sha256:9acdaf46b6c855da98e83148d203029a7f8d17f9591c553c47efb239e1ce6e8f
    command: web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *common-env
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8000}:8000"
    volumes:
      - ${MEDIA_PATH:-./media}:/data/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    image: ghcr.io/ashleycollinge1/advanced-speech-to-text:0.1.0@sha256:9acdaf46b6c855da98e83148d203029a7f8d17f9591c553c47efb239e1ce6e8f
    command: worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *common-env
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_THREADS: ${WHISPER_THREADS:-0}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-5}
    volumes:
      - ${MEDIA_PATH:-./media}:/data/media
      - models:/data/models
    stop_grace_period: 30s

volumes:
  pgdata:
  models:
