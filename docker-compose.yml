# Local development: builds the image from this checkout.
# For deployments use a versioned file in deploy/compose/.
#   docker compose up --build      then open http://localhost:8000 (admin / change-me-please)
name: advanced-speech-to-text-dev

x-common-env: &common-env
  POSTGRES_HOST: db
  POSTGRES_USER: ${POSTGRES_USER:-stt}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stt-dev-password}
  POSTGRES_DB: ${POSTGRES_DB:-stt}
  WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
  WHISPER_MODELS: ${WHISPER_MODELS:-small.en,medium.en,large-v3-turbo,large-v3}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stt-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-stt}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    image: advanced-speech-to-text:dev
    command: web
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *common-env
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-please}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - ${MEDIA_PATH:-./media}:/data/media

  worker:
    image: advanced-speech-to-text:dev
    command: worker
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      <<: *common-env
      WHISPER_THREADS: ${WHISPER_THREADS:-0}
    volumes:
      - ${MEDIA_PATH:-./media}:/data/media
      - models:/data/models
    stop_grace_period: 30s

volumes:
  pgdata:
  models:
